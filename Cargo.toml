[workspace]
resolver = "3"
members = [
    "crates/suaya-core",
    "crates/suaya-escaneo",
    "crates/suaya-cbom",
    "crates/suaya-red",
    "crates/suaya-cli",
    "crates/suaya-api",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.7.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["José Enrique Rangel Ramírez y personas contribuyentes de Suaya"]
description = "Suaya: inventario criptográfico abierto (CBOM) en español, con evaluación de preparación poscuántica."
keywords = ["cbom", "cryptography", "post-quantum", "pqc", "cyclonedx"]
categories = ["cryptography", "command-line-utilities"]

[workspace.dependencies]
suaya-core = { path = "crates/suaya-core", version = "1.7.0" }
suaya-escaneo = { path = "crates/suaya-escaneo", version = "1.7.0" }
suaya-cbom = { path = "crates/suaya-cbom", version = "1.7.0" }
suaya-red = { path = "crates/suaya-red", version = "1.7.0" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ecdsa"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros"] }
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
x509-parser = "0.18.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
