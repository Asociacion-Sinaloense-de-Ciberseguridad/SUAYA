# Perfil de política: hoja de ruta del Gobierno de Canadá para la migración a
# criptografía poscuántica (Centro Canadiense de Ciberseguridad, junio de 2025).
#
# Hitos: planes iniciales de cada dependencia en abril de 2026; sistemas de
# alta prioridad migrados a finales de 2031; el resto a finales de 2035.
#
# Suaya asigna el plazo de 2031 a los activos de sistemas con criticidad
# «alta» en el archivo de contexto (--contexto); sin contexto, aplica 2035.
# Es una interpretación de Suaya: verifique la guía vigente.

[perfil]
id = "canada-cccs"
nombre = "Canadá (CCCS): hoja de ruta de migración a PQC"
referencia = "Canadian Centre for Cyber Security, Roadmap for the migration to post-quantum cryptography for the Government of Canada (junio de 2025)"
predeterminado = "sin-evaluar"
ignorar_primitivas = ["other", "kdf"]

[[regla]]
riesgos = ["roto-clasico", "obsoleto"]
estado = "no-conforme"
nota = "Inseguro o retirado por los estándares vigentes."

[[regla]]
riesgos = ["vulnerable-cuantico"]
criticidades = ["alta"]
estado = "transicion"
retiro = 2026
prohibicion = 2031
nota = "Sistema de alta prioridad: la hoja de ruta pide migrarlo a finales de 2031."

[[regla]]
riesgos = ["vulnerable-cuantico"]
estado = "transicion"
retiro = 2026
prohibicion = 2035
nota = "La hoja de ruta pide migrar los sistemas restantes a finales de 2035."

[[regla]]
riesgos = ["debilitado-grover", "hibrido-pq", "resistente-cuantico"]
estado = "conforme"
