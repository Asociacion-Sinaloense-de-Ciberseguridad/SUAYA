# Suaya: bibliotecas y entornos criptográficos.
#
# Suaya reconoce una biblioteca por su nombre de paquete en un ecosistema
# ("pypi:cryptography", "golang:golang.org/x/crypto"), por la cadena de
# versión dentro de un binario (OpenSSL, LibreSSL) o por la información de
# compilación de Go. Con la versión decide:
#
#   - si la rama ya no tiene soporte (riesgo obsoleto: reemplazar);
#   - si la versión ya ofrece PQC (pq_disponible) y si la usa por omisión
#     (pq_predeterminado);
#   - si no se sabe, la reporta para verificar, sin afirmar nada.
#
# Campos:
#   id, nombre             identificador y nombre legible
#   paquetes               "<ecosistema>:<nombre>" (pypi, npm, maven, golang,
#                          cargo, nuget, binario, jar, runtime)
#   pq_disponible          primera versión con ML-KEM o ML-DSA
#   pq_predeterminado      primera versión que negocia un grupo híbrido por omisión
#   nota_pq                qué ofrece exactamente
#   riesgo_predeterminado  riesgo cuando no hay datos de PQC ni de soporte
#   nota                   advertencia fija
#   version_en_metadatos   la versión real va tras «+» (p. ej. openssl-src 300.3.1+3.3.1)
#   [[biblioteca.rama]]    version (prefijo) y fin_soporte (AAAA-MM-DD)
#
# Las fechas son una fotografía: se actualizan aquí, sin recompilar.

[meta]
version = "2026.10.0"
descripcion = "Bibliotecas criptográficas iniciales; fechas de fin de soporte al 16 de octubre de 2026"
fuente = "Políticas de publicación de cada proyecto, resumidas en endoflife.date"

[[biblioteca]]
id = "openssl"
nombre = "OpenSSL"
paquetes = ["binario:openssl", "cargo:openssl-src", "conan:openssl", "vcpkg:openssl"]
version_en_metadatos = true
pq_disponible = "3.5.0"
pq_predeterminado = "3.5.0"
nota_pq = "Desde 3.5 ofrece ML-KEM, ML-DSA y SLH-DSA, y X25519MLKEM768 entre los grupos predeterminados de TLS."
rama = [
  { version = "4.0", fin_soporte = "2027-05-14" },
  { version = "3.6", fin_soporte = "2026-11-01" },
  { version = "3.5", fin_soporte = "2030-04-08" },
  { version = "3.4", fin_soporte = "2026-10-22" },
  { version = "3.3", fin_soporte = "2026-04-09" },
  { version = "3.2", fin_soporte = "2025-11-23" },
  { version = "3.1", fin_soporte = "2025-03-14" },
  { version = "3.0", fin_soporte = "2026-09-07" },
  { version = "1.1.1", fin_soporte = "2023-09-11" },
  { version = "1.1.0", fin_soporte = "2019-09-11" },
  { version = "1.0", fin_soporte = "2019-12-31" },
  { version = "0.9", fin_soporte = "2015-12-31" },
]

[[biblioteca]]
id = "libressl"
nombre = "LibreSSL"
paquetes = ["binario:libressl"]

[[biblioteca]]
id = "boringssl"
nombre = "BoringSSL"
paquetes = ["binario:boringssl"]
nota = "BoringSSL no publica versiones: su soporte de PQC depende de la revisión que integra cada producto."

[[biblioteca]]
