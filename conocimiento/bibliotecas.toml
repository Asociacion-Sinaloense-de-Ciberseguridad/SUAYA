nombre = "Go (biblioteca estándar)"
paquetes = ["golang:stdlib", "binario:go"]
pq_disponible = "1.24"
pq_predeterminado = "1.24"
nota_pq = "Desde Go 1.24, crypto/mlkem ofrece ML-KEM y crypto/tls negocia X25519MLKEM768 por omisión."
rama = [
  { version = "1.25", fin_soporte = "2026-08-19" },
  { version = "1.24", fin_soporte = "2026-02-10" },
  { version = "1.23", fin_soporte = "2025-08-12" },
  { version = "1.22", fin_soporte = "2025-02-11" },
  { version = "1.21", fin_soporte = "2024-08-13" },
  { version = "1.20", fin_soporte = "2024-02-06" },
  { version = "1.19", fin_soporte = "2023-08-08" },
  { version = "1.18", fin_soporte = "2023-02-01" },
]

