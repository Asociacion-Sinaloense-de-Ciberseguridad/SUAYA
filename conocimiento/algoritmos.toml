# Suaya: registro de algoritmos criptográficos.
#
# Cada entrada describe un algoritmo (o conjunto de parámetros) y su riesgo.
# El código de Suaya no contiene listas de algoritmos: todo criterio vive aquí,
# para que actualizar el conocimiento no requiera recompilar (criptoagilidad).
#
# Campos:
#   id                     identificador estable dentro de Suaya
#   nombre                 nombre legible
#   familia                valor del enum algorithmFamily de CycloneDX 1.7 (opcional)
#   primitiva              enum primitive de CycloneDX 1.7
#   oids                   OIDs que identifican al algoritmo
#   alias                  nombres por espacio: "<espacio>:<nombre>" en minúsculas.
#                          Espacios: x509, ssh, ssh-llave, ssh-kex, ssh-cifrado,
#                          ssh-mac, tls-grupo, tls-protocolo, volumen
#   riesgo                 roto-clasico | obsoleto | vulnerable-cuantico |
#                          debilitado-grover | hibrido-pq | resistente-cuantico
#   garantia               confidencialidad | autenticacion | integridad
#   tamano_minimo_clasico  si la llave es menor, el riesgo pasa a roto-clasico
#   nivel_clasico          seguridad clásica en bits
#   nivel_nist_cuantico    categoría de seguridad NIST (0 = ninguna)
#   codigos_tls            identificadores IANA de grupo TLS (NamedGroup), en
#                          decimal; el sondeo de red ofrece exactamente estos

[meta]
version = "2026.10.0"
descripcion = "Registro inicial de algoritmos para Suaya"

# Fechas de transición usadas para advertir sobre activos vulnerables con
# vigencia larga (por ejemplo, certificados que vencen después de 2030).
[politica]
anio_retiro_vulnerables = 2030
anio_prohibicion_vulnerables = 2035
referencia = "NIST IR 8547, Transition to Post-Quantum Cryptography Standards (borrador inicial, noviembre de 2024)"

