# ---------------------------------------------------------------------------
[[algoritmo]]
id = "rsa"
nombre = "RSA"
primitiva = "pke"
oids = ["1.2.840.113549.1.1.1"]
alias = ["x509:rsa", "ssh-llave:rsa"]
riesgo = "vulnerable-cuantico"
garantia = "autenticacion"
tamano_minimo_clasico = 2048
nivel_nist_cuantico = 0
nota = "Factorización eficiente con el algoritmo de Shor. Migrar a ML-DSA (firma) o ML-KEM (establecimiento de llaves)."

