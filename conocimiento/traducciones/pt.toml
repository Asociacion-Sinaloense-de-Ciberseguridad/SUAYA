[[texto]]
es = "Cada activo se evalúa en cuatro ejes: **riesgo** (roto, obsoleto, vulnerable al algoritmo de Shor, debilitado por Grover, híbrido o resistente), **garantía** (confidencialidad, autenticación o integridad), **capacidad tecnológica** y **madurez del ecosistema** para adoptar PQC. La confidencialidad se prioriza porque los datos cifrados hoy pueden almacenarse y descifrarse en el futuro."
pt = "Cada ativo é avaliado em quatro eixos: **risco** (quebrado, obsoleto, vulnerável ao algoritmo de Shor, enfraquecido por Grover, híbrido ou resistente), **garantia** (confidencialidade, autenticação ou integridade), **capacidade tecnológica** e **maturidade do ecossistema** para adotar PQC. A confidencialidade tem prioridade porque os dados cifrados hoje podem ser armazenados e decifrados no futuro."

[[texto]]
es = "Los niveles de madurez provienen de: {fuente}, edición {edicion}, con evidencia de {evidencia}. © MITRE, aprobado para difusión pública (caso {caso}). Suaya usa sus niveles con atribución y no reproduce su texto."
pt = "Os níveis de maturidade vêm de: {fuente}, edição {edicion}, com evidências de {evidencia}. © MITRE, aprovado para divulgação pública (caso {caso}). O Suaya usa seus níveis com atribuição e não reproduz seu texto."

[[texto]]
es = "**Alcance.** Suaya inspecciona archivos, configuraciones, código y los servicios que se le indican; no observa el tráfico real. Cuando una configuración no declara un parámetro, el resultado depende de la versión instalada del software y se marca para verificación. Suaya nunca copia material secreto al inventario."
pt = "**Escopo.** O Suaya inspeciona arquivos, configurações, código e os serviços indicados; não observa o tráfego real. Quando uma configuração não declara um parâmetro, o resultado depende da versão instalada do software e é marcado para verificação. O Suaya nunca copia material secreto para o inventário."

[[texto]]
es = "Suaya inventarió **{} activos criptográficos**. **{}** requieren corrección inmediata porque ya son inseguros hoy, sin necesidad de una computadora cuántica. **{}** son vulnerables a cómputo cuántico y **pueden migrarse ya**, porque el ecosistema de su capacidad ofrece soluciones generales con PQC. **{}** deben planificarse con pilotos, porque solo existen componentes o versiones preliminares. **{}** ya son conformes: resistentes a cómputo cuántico o protegidos con un esquema híbrido."
pt = "O Suaya inventariou **{} ativos criptográficos**. **{}** exigem correção imediata porque já são inseguros hoje, sem necessidade de um computador quântico. **{}** são vulneráveis à computação quântica e **podem ser migrados já**, porque o ecossistema de sua capacidade oferece soluções gerais com PQC. **{}** devem ser planejados com pilotos, porque só existem componentes ou versões preliminares. **{}** já estão conformes: resistentes à computação quântica ou protegidos com um esquema híbrido."

[[texto]]
es = "Se encontraron **{certificados} certificados raíz** en almacenes de confianza. Su reemplazo no depende de quien opera el sistema, sino de las autoridades certificadoras y del proveedor del sistema operativo, por lo que se resumen aquí y la acción recomendada es monitorear y mantener el sistema actualizado."
pt = "Foram encontrados **{certificados} certificados raiz** em repositórios de confiança. Sua substituição não depende de quem opera o sistema, mas das autoridades certificadoras e do fornecedor do sistema operacional; por isso são resumidos aqui e a ação recomendada é monitorar e manter o sistema atualizado."

[[texto]]
es = "Cobertura parcial o no declarada. No interpretar ausencia de hallazgos como ausencia de riesgo."
pt = "Cobertura parcial ou não declarada. Não interprete a ausência de achados como ausência de risco."

[[texto]]
es = "Pasos de corrección de la base de conocimiento (remediacion.toml) para los hallazgos de este reporte, de lo más urgente a lo menos. Verifique cada directiva contra la documentación de su producto antes de aplicarla."
pt = "Passos de correção da base de conhecimento (remediacion.toml) para os achados deste relatório, do mais urgente ao menos urgente. Confira cada diretiva com a documentação do seu produto antes de aplicá-la."

