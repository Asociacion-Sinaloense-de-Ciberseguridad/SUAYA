[[texto]]
es = "El contexto declarado por la organización asigna cada activo a sus sistemas y responsables. La desigualdad de Mosca (x + y > z) compara cuántos años deben seguir confidenciales los datos (x) más lo que tarda la migración (y) con los años que faltan para una computadora cuántica relevante (z): si se cumple, lo que hoy se captura cifrado podrá descifrarse mientras siga siendo valioso."
pt = "O contexto declarado pela organização atribui cada ativo a seus sistemas e responsáveis. A desigualdade de Mosca (x + y > z) compara quantos anos os dados devem permanecer confidenciais (x) mais o tempo da migração (y) com os anos que faltam para um computador quântico relevante (z): se ela se cumpre, o que hoje é capturado cifrado poderá ser decifrado enquanto ainda tiver valor."

