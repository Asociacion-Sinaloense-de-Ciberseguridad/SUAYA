# Suaya: catálogo de traducciones del español al portugués (Brasil).
#
# Cubre el reporte ejecutivo, las etiquetas (riesgo, acción, prioridad,
# garantía, madurez y capacidades), la justificación de cada clasificación y
# el resumen de la línea de órdenes. Lo que falte se muestra en español: el
# texto de Suaya nunca se pierde. Cada entrada es una plantilla como en
# en.toml: `{}` o `{nombre}` coinciden con cualquier valor.

