[[texto]]
es = "El requisito 12.3.3 pide documentar y revisar al menos una vez al año las suites y protocolos criptográficos en uso, con su propósito y ubicación, vigilar su viabilidad y tener una estrategia de respuesta ante cambios; el 4.2.1.1, mantener un inventario de las llaves y certificados de confianza con que se protege la transmisión de datos de tarjetas. Este documento se generó a partir del CBOM de Suaya; la evaluación del alcance (qué sistemas tocan datos de tarjetas) corresponde a la organización."
pt = "O requisito 12.3.3 pede documentar e revisar pelo menos uma vez por ano as suítes e os protocolos criptográficos em uso, com seu propósito e localização, acompanhar sua viabilidade e ter uma estratégia de resposta a mudanças; o 4.2.1.1, manter um inventário das chaves e certificados confiáveis que protegem a transmissão de dados de cartão. Este documento foi gerado a partir do CBOM do Suaya; a avaliação do escopo (quais sistemas tocam dados de cartão) cabe à organização."

