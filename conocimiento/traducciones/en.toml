[[texto]]
es = "Sondea servicios de red (TLS, STARTTLS, SSH, IKEv2, DNS, OpenID Connect y SAML) y genera el CBOM"
en = "Probes network services (TLS, STARTTLS, SSH, IKEv2, DNS, OpenID Connect and SAML) and generates the CBOM"

[[texto]]
es = "Sondea servicios de red para observar la criptografía que ofrecen realmente: versiones de TLS, grupos de intercambio de llaves (incluidos los híbridos con ML-KEM), suites de TLS 1.2, cadenas de certificados por familia de firma, algoritmos y llaves de host SSH, grupos IKEv2 (con ML-KEM según RFC 9370), DNSSEC, DKIM, CAA y TLSA de un dominio, y las llaves y algoritmos de proveedores OpenID Connect y SAML.\n\nUso responsable: sondee solo sistemas que administre o que tenga autorización expresa para evaluar. Un objetivo TLS recibe entre treinta y setenta conexiones breves y secuenciales; los demás, unas pocas."
en = "Probes network services to observe the cryptography they actually offer: TLS versions, key exchange groups (including hybrids with ML-KEM), TLS 1.2 suites, certificate chains per signature family, SSH algorithms and host keys, IKEv2 groups (with ML-KEM per RFC 9370), a domain's DNSSEC, DKIM, CAA and TLSA, and the keys and algorithms of OpenID Connect and SAML providers.\n\nResponsible use: probe only systems you administer or are expressly authorized to assess. A TLS target receives between thirty and seventy brief, sequential connections; the others, only a few."

