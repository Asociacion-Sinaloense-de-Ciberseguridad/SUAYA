en = "Java ({})"

[[texto]]
es = "La configuración no fija los grupos de intercambio de llaves de TLS: el servidor usa los predeterminados de su biblioteca OpenSSL (desde OpenSSL 3.5 incluyen X25519MLKEM768; antes solo hay grupos clásicos). Verifique la versión de OpenSSL enlazada."
en = "The configuration does not set the TLS key exchange groups: the server uses the defaults of its OpenSSL library (since OpenSSL 3.5 they include X25519MLKEM768; before that only classical groups). Check the linked OpenSSL version."

[[texto]]
es = "TLS deshabilitado en el servidor: las consultas, los resultados y las credenciales viajan sin cifrar."
en = "TLS disabled on the server: queries, results and credentials travel unencrypted."

[[texto]]
es = "MariaDB sin opciones de TLS: antes de la versión 11.4 el servidor no cifra por omisión. Declare ssl_cert, ssl_key y require_secure_transport=ON."
en = "MariaDB without TLS options: before version 11.4 the server does not encrypt by default. Declare ssl_cert, ssl_key and require_secure_transport=ON."

[[texto]]
es = "No declara tls_version: se asume el predeterminado de las versiones actuales (TLSv1.2 y TLSv1.3)."
en = "tls_version is not declared: the default of current versions is assumed (TLSv1.2 and TLSv1.3)."

[[texto]]
es = "No exige transporte cifrado (require_secure_transport=ON): un cliente puede conectarse sin TLS y exponer sus credenciales."
en = "Does not require encrypted transport (require_secure_transport=ON): a client can connect without TLS and expose its credentials."

[[texto]]
es = "Sin ssl_cert, MySQL usa el certificado autofirmado que genera en su directorio de datos (RSA de 2048 bits): los clientes no pueden verificar la identidad del servidor."
en = "Without ssl_cert, MySQL uses the self-signed certificate it generates in its data directory (2048-bit RSA): clients cannot verify the server's identity."

[[texto]]
es = "No declara tls_eecdh_auto_curves: Postfix usa sus curvas predeterminadas, que son clásicas salvo que su versión y OpenSSL (3.5 o posterior) agreguen X25519MLKEM768. Verifique la versión de OpenSSL enlazada."
en = "tls_eecdh_auto_curves is not declared: Postfix uses its default curves, which are classical unless its version and OpenSSL (3.5 or later) add X25519MLKEM768. Check the linked OpenSSL version."

[[texto]]
es = "El servidor SMTP no ofrece STARTTLS (smtpd_tls_security_level=none): el correo y las credenciales SMTP AUTH viajan sin cifrar."
en = "The SMTP server does not offer STARTTLS (smtpd_tls_security_level=none): mail and SMTP AUTH credentials travel unencrypted."

[[texto]]
es = "TLS oportunista (smtpd_tls_security_level=may): un atacante en la red puede suprimir STARTTLS y forzar texto claro. Para el intercambio entre sistemas propios exija TLS (encrypt) o publique DANE o MTA-STS."
en = "Opportunistic TLS (smtpd_tls_security_level=may): a network attacker can strip STARTTLS and force plaintext. For exchange between your own systems require TLS (encrypt) or publish DANE or MTA-STS."

[[texto]]
es = "El envío saliente no usa TLS (smtp_tls_security_level=none): el correo hacia otros servidores viaja sin cifrar. Use al menos «may», o «dane» con DNSSEC."
en = "Outbound delivery does not use TLS (smtp_tls_security_level=none): mail to other servers travels unencrypted. Use at least \"may\", or \"dane\" with DNSSEC."

[[texto]]
es = "No declara ssl_groups ni ssl_ecdh_curve: los grupos predeterminados de PostgreSQL son clásicos. Declare un grupo híbrido (p. ej. X25519MLKEM768) si su versión de PostgreSQL y OpenSSL lo admiten."
en = "Neither ssl_groups nor ssl_ecdh_curve is declared: PostgreSQL's default groups are classical. Declare a hybrid group (e.g. X25519MLKEM768) if your PostgreSQL and OpenSSL versions support it."

[[texto]]
es = "No declara «ssl» (predeterminado: off) y escucha en «{escucha}». Si no se activa en postgresql.auto.conf o en un archivo incluido, las conexiones viajan sin cifrar."
en = "\"ssl\" is not declared (default: off) and it listens on \"{escucha}\". Unless it is enabled in postgresql.auto.conf or an included file, connections travel unencrypted."

[[texto]]
es = "SSL deshabilitado y escucha en «{escucha}»: las conexiones a la base de datos viajan sin cifrar."
en = "SSL disabled while listening on \"{escucha}\": database connections travel unencrypted."

