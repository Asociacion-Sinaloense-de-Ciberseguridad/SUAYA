en = "cert-manager will generate keys with this algorithm on every renewal. To migrate, change spec.privateKey.algorithm once your cert-manager version and issuer support a post-quantum algorithm."

[[texto]]
es = "spec.privateKey.rotationPolicy no es «Always»: la llave se reutiliza en las renovaciones, lo que alarga su exposición y retrasa la migración."
en = "spec.privateKey.rotationPolicy is not \"Always\": the key is reused across renewals, which lengthens its exposure and delays migration."

