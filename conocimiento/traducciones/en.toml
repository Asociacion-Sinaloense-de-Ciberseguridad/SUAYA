[[texto]]
es = "SHA-1 tiene colisiones prácticas; las firmas con SHA-1 no son confiables."
en = "SHA-1 has practical collisions; signatures with SHA-1 are not trustworthy."

[[texto]]
es = "MD5 está roto para firmas."
en = "MD5 is broken for signatures."

[[texto]]
es = "FIPS 186-5 ya no aprueba DSA para generar firmas."
en = "FIPS 186-5 no longer approves DSA for signature generation."

[[texto]]
es = "Usa SHA-1 o grupos de 1024 bits; debe deshabilitarse."
en = "Uses SHA-1 or 1024-bit groups; it must be disabled."

[[texto]]
es = "Grupo híbrido más desplegado en navegadores y servidores."
en = "The most widely deployed hybrid group in browsers and servers."

[[texto]]
es = "Híbrido con un algoritmo no estandarizado por NIST. Preferir mlkem768x25519-sha256."
en = "Hybrid with an algorithm not standardized by NIST. Prefer mlkem768x25519-sha256."

[[texto]]
es = "Borrador previo a FIPS 203, ya retirado por los navegadores. Sustituir por X25519MLKEM768."
en = "Pre-FIPS 203 draft, already retired by browsers. Replace with X25519MLKEM768."

[[texto]]
es = "Aceptable para NIST (categoría 1); CNSA 2.0 exige AES-256."
en = "Acceptable to NIST (category 1); CNSA 2.0 requires AES-256."

[[texto]]
es = "Bloque de 64 bits vulnerable a Sweet32; retirado por NIST."
en = "64-bit block vulnerable to Sweet32; retired by NIST."

[[texto]]
es = "Esquema de cifrado con contraseña; su fortaleza depende de la KDF, el cifrador y la contraseña."
en = "Password-based encryption scheme; its strength depends on the KDF, the cipher and the password."

[[texto]]
es = "Predeterminado de LUKS2 (llave XTS de 512 bits)."
en = "LUKS2 default (512-bit XTS key)."

[[texto]]
es = "No está roto como MAC, pero SHA-1 está en retiro; sustituir por HMAC-SHA-256."
en = "Not broken as a MAC, but SHA-1 is being retired; replace with HMAC-SHA-256."

[[texto]]
es = "Grupos menores a 2048 bits: alcanzables con cómputo clásico (Logjam)."
en = "Groups smaller than 2048 bits: within reach of classical computing (Logjam)."

[[texto]]
es = "Bloque de 64 bits vulnerable a Sweet32; era el cifrador predeterminado de OpenVPN antes de 2.4."
en = "64-bit block vulnerable to Sweet32; it was OpenVPN's default cipher before 2.4."

[[texto]]
es = "MD5 está roto; retirado de IPsec y SSH."
en = "MD5 is broken; retired from IPsec and SSH."

[[texto]]
es = "Prohibido por RFC 6176."
en = "Prohibited by RFC 6176."

[[texto]]
es = "Prohibido por RFC 7568 (POODLE)."
en = "Prohibited by RFC 7568 (POODLE)."

[[texto]]
es = "Retirado por RFC 8996."
en = "Retired by RFC 8996."

[[texto]]
es = "Los grupos híbridos con ML-KEM están definidos para TLS 1.3; una conexión TLS 1.2 no puede negociarlos."
en = "Hybrid groups with ML-KEM are defined for TLS 1.3; a TLS 1.2 connection cannot negotiate them."

[[texto]]
es = "Requisito para negociar grupos híbridos poscuánticos; el riesgo real depende de los grupos configurados."
en = "Required to negotiate post-quantum hybrid groups; the actual risk depends on the configured groups."

[[texto]]
es = "Colisiones prácticas desde 2004; no sirve para integridad, firmas ni contraseñas."
en = "Practical collisions since 2004; unfit for integrity, signatures or passwords."

[[texto]]
es = "Colisiones prácticas (SHAttered, 2017); NIST lo retira a más tardar en 2030. Sustituir por SHA-256 o SHA-3."
en = "Practical collisions (SHAttered, 2017); NIST retires it by 2030 at the latest. Replace with SHA-256 or SHA-3."

[[texto]]
es = "Llave de 56 bits, recuperable por fuerza bruta."
en = "56-bit key, recoverable by brute force."

[[texto]]
es = "Sesgos explotables en el flujo de llave; prohibido en TLS por RFC 7465."
en = "Exploitable keystream biases; prohibited in TLS by RFC 7465."

[[texto]]
es = "Bloque de 64 bits, expuesto a ataques de cumpleaños (Sweet32)."
en = "64-bit block, exposed to birthday attacks (Sweet32)."

[[texto]]
es = "El código no fija el tamaño de llave: con 128 bits el margen queda reducido por Grover; con 256 bits es resistente."
en = "The code does not fix the key size: with 128 bits Grover reduces the margin; with 256 bits it is resistant."

[[texto]]
es = "Cifra bloques iguales en bloques iguales y revela patrones; use GCM o ChaCha20-Poly1305. En Java, «AES» sin modo equivale a AES/ECB."
en = "Encrypts equal blocks into equal blocks and reveals patterns; use GCM or ChaCha20-Poly1305. In Java, \"AES\" without a mode means AES/ECB."

[[texto]]
es = "El código no fija la curva; cualquier curva elíptica es vulnerable al algoritmo de Shor."
en = "The code does not fix the curve; any elliptic curve is vulnerable to Shor's algorithm."

[[texto]]
es = "Sin Poly1305 no autentica el mensaje; prefiera ChaCha20-Poly1305."
en = "Without Poly1305 it does not authenticate the message; prefer ChaCha20-Poly1305."

[[texto]]
es = "Firma compuesta: ML-DSA-{} junto con {}, prehash {}. El validador debe exigir ambas firmas; aceptar solo la clásica anula la protección poscuántica (despojo)."
en = "Composite signature: ML-DSA-{} together with {}, prehash {}. The verifier must require both signatures; accepting only the classical one voids the post-quantum protection (stripping)."

