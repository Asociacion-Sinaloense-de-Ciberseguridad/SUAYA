[[texto]]
es = "Crea un contexto TLS sin verificación de certificado o de nombre: la conexión cifra, pero no autentica al servidor."
en = "Creates a TLS context without certificate or hostname verification: the connection encrypts but does not authenticate the server."

[[texto]]
es = "Un X509TrustManager con checkServerTrusted vacío acepta cualquier certificado: la conexión TLS no autentica al servidor."
en = "An X509TrustManager with an empty checkServerTrusted accepts any certificate: the TLS connection does not authenticate the server."

[[texto]]
es = "Un HostnameVerifier que siempre devuelve true acepta certificados emitidos para otros nombres."
en = "A HostnameVerifier that always returns true accepts certificates issued for other names."

[[texto]]
es = "InsecureSkipVerify: true desactiva la verificación del certificado TLS: cualquiera en la red puede suplantar al servidor."
en = "InsecureSkipVerify: true disables TLS certificate verification: anyone on the network can impersonate the server."

[[texto]]
es = "Desactiva la verificación del certificado TLS (rejectUnauthorized: false o NODE_TLS_REJECT_UNAUTHORIZED=0)."
en = "Disables TLS certificate verification (rejectUnauthorized: false or NODE_TLS_REJECT_UNAUTHORIZED=0)."

[[texto]]
es = "Un validador de certificados que siempre devuelve true acepta cualquier servidor TLS."
en = "A certificate validator that always returns true accepts any TLS server."

[[texto]]
es = "El cliente TLS acepta certificados inválidos o usa un verificador propio: revise que no omita la autenticación del servidor."
en = "The TLS client accepts invalid certificates or uses its own verifier: check that it does not skip server authentication."

[[texto]]
es = "SSL_VERIFY_NONE desactiva la verificación del certificado del par TLS."
en = "SSL_VERIFY_NONE disables verification of the TLS peer certificate."

[[texto]]
es = "Java elige los grupos de TLS con la propiedad del sistema jdk.tls.namedGroups, fuera de java.security. Verifique si su versión del JDK ofrece grupos híbridos con ML-KEM y si las aplicaciones fijan esa propiedad."
en = "Java chooses TLS groups with the jdk.tls.namedGroups system property, outside java.security. Check whether your JDK version offers hybrid groups with ML-KEM and whether applications set that property."

[[texto]]
es = "jdk.tls.disabledAlgorithms ya no excluye {}: Java puede negociar cifrados rotos. Restaure la lista predeterminada del JDK."
en = "jdk.tls.disabledAlgorithms no longer excludes {}: Java may negotiate broken ciphers. Restore the JDK default list."

[[texto]]
es = "jdk.certpath.disabledAlgorithms ya no excluye {}: se aceptan certificados firmados con resúmenes rotos."
en = "jdk.certpath.disabledAlgorithms no longer excludes {}: certificates signed with broken digests are accepted."

[[texto]]
es = "jdk.certpath.disabledAlgorithms no limita el tamaño de RSA (se espera «RSA keySize < 1024» o más): se aceptan certificados con llaves RSA débiles."
en = "jdk.certpath.disabledAlgorithms does not limit the RSA size (\"RSA keySize < 1024\" or more is expected): certificates with weak RSA keys are accepted."

[[texto]]
es = "jdk.jar.disabledAlgorithms ya no excluye {}: se aceptan JAR firmados con resúmenes rotos (capacidad de firma de código)."
en = "jdk.jar.disabledAlgorithms no longer excludes {}: JARs signed with broken digests are accepted (code signing capability)."

[[texto]]
es = "keystore.type usa el formato heredado JKS/JCEKS, que protege las llaves con algoritmos propietarios débiles. Use PKCS12."
en = "keystore.type uses the legacy JKS/JCEKS format, which protects keys with weak proprietary algorithms. Use PKCS12."

[[texto]]
