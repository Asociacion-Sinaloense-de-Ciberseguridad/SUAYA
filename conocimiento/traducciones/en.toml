# --- 1.6: diagnóstico de conectividad e intercambio de llaves y certificados ---

[[texto]]
es = "Diagnostica la conectividad y el intercambio de llaves y certificados de servicios de red (TLS, STARTTLS, SSH, IKEv2, DNS, OpenID Connect y SAML)"
en = "Diagnoses connectivity and the key and certificate exchange of network services (TLS, STARTTLS, SSH, IKEv2, DNS, OpenID Connect and SAML)"

[[texto]]
es = "Diagnostica lo que obtiene realmente un cliente al conectarse: resolución del nombre, cada dirección IPv4 e IPv6 con su latencia, el preámbulo STARTTLS, dos saludos TLS completos (un cliente moderno con X25519MLKEM768 y uno solo clásico) con el grupo negociado, la suite y la firma, y la validación estándar de la cadena de certificados (autoridad, nombre, vigencia y su máximo según el CA/Browser Forum, orden, llaves, firmas y OCSP). En SSH, el KEXINIT con sus intercambios poscuánticos y la mitigación de Terrapin. En IKEv2, los grupos aceptados y el intercambio adicional con ML-KEM. En DNS, DNSSEC (llaves, delegación y firmas), CAA, TLSA y DKIM. En OpenID Connect y SAML, los algoritmos anunciados, las llaves JWKS y los certificados de los metadatos.\n\nUso responsable: diagnostique solo sistemas que administre o que tenga autorización expresa para evaluar. No se envían datos de aplicación."
en = "Diagnoses what a client actually gets when it connects: name resolution, each IPv4 and IPv6 address with its latency, the STARTTLS preamble, two full TLS handshakes (a modern client with X25519MLKEM768 and a classical-only one) with the negotiated group, suite and signature, and standard validation of the certificate chain (authority, name, validity and its CA/Browser Forum maximum, order, keys, signatures and OCSP). For SSH, the KEXINIT with its post-quantum key exchanges and the Terrapin mitigation. For IKEv2, the accepted groups and the additional ML-KEM key exchange. For DNS, DNSSEC (keys, delegation and signatures), CAA, TLSA and DKIM. For OpenID Connect and SAML, the advertised algorithms, the JWKS keys and the metadata certificates.\n\nResponsible use: diagnose only systems you administer or are expressly authorized to assess. No application data is sent."

[[texto]]
es = "Servicios a diagnosticar: tls://, ssh://, ike://, smtp://, imap://, pop3://, ldap://, postgres://, mysql://, ftp://, xmpp:// o rdp://host:puerto, o host:puerto; dns://dominio; oidc:// o saml://host/ruta"
