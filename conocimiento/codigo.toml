# ---------------------------------------------------------------------------
# PowerShell (certificados autofirmados, .NET y protocolos de TLS)
# ---------------------------------------------------------------------------
[[regla]]
lenguajes = ["powershell"]
patron = '''\bNew-SelfSignedCertificate\b[^\n]*?-KeyAlgorithm\s+['"]?(RSA|ECDSA_nistP256|ECDSA_nistP384|ECDSA_nistP521|ECDH_nistP256|ECDH_nistP384)\b'''
espacio = "powershell-llave"
capacidad = "pki-ca"

[[regla]]
lenguajes = ["powershell"]
patron = '''\bNew-SelfSignedCertificate\b[^\n]*?-KeyLength\s+(\d{3,5})'''
algoritmo = "rsa"
tamano = 1
capacidad = "pki-ca"

[[regla]]
lenguajes = ["powershell"]
patron = '''\bNew-SelfSignedCertificate\b[^\n]*?-HashAlgorithm\s+['"]?(MD5|SHA1|SHA256|SHA384|SHA512)\b'''
espacio = "codigo"
capacidad = "pki-ca"

[[regla]]
lenguajes = ["powershell"]
patron = '''\[(?:System\.)?Security\.Cryptography\.(MD5|SHA1|SHA256|SHA384|SHA512|TripleDES|DES|RC2|Aes|RSA|ECDsa)\]::Create\('''
espacio = "codigo"

[[regla]]
lenguajes = ["powershell"]
patron = '''(?:SecurityProtocolType\]::|\bSecurityProtocol\s*=\s*['"]?(?:\[[^\]]*\]::)?)(Ssl3|Tls13|Tls12|Tls11|Tls)\b'''
espacio = "powershell-tls"

[[hallazgo]]
lenguajes = ["powershell"]
patron = '''\bServerCertificateValidationCallback\s*=\s*\{\s*\$true\s*\}|\s-SkipCertificateCheck\b'''
riesgo = "roto-clasico"
advertencia = "Desactiva la validación del certificado TLS en PowerShell: la conexión no autentica al servidor."

# ---------------------------------------------------------------------------
# Comandos que generan llaves y certificados (shell, Dockerfile, Makefile,
