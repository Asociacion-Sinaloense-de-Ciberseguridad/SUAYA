espacio = "codigo"

[[regla]]
lenguajes = ["swift"]
patron = '''\b(SHA256|SHA384|SHA512)\.hash\('''
espacio = "codigo"

[[regla]]
lenguajes = ["swift"]
patron = '''\bP(256|384|521)\.Signing\b'''
espacio = "codigo"
formato = "p{1}"

[[regla]]
lenguajes = ["swift"]
patron = '''\bP(256|384|521)\.KeyAgreement\b'''
