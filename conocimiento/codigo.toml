# ---------------------------------------------------------------------------
# PHP (OpenSSL, hash, mcrypt, sodium, password_hash)
# ---------------------------------------------------------------------------
[[regla]]
lenguajes = ["php"]
patron = '''\bopenssl_(?:encrypt|decrypt)\s*\([^,]*,\s*['"]([A-Za-z0-9\-]+)['"]'''
espacio = "codigo"

[[regla]]
lenguajes = ["php"]
patron = '''\bhash(?:_init|_file)?\s*\(\s*['"]([A-Za-z0-9\-/]+)['"]'''
espacio = "codigo"
ignorar = ["crc32", "crc32b", "adler32", "fnv132", "fnv1a32", "fnv164", "fnv1a64", "joaat", "xxh3", "xxh32", "xxh64", "xxh128", "murmur3a", "murmur3c", "murmur3f"]

[[regla]]
lenguajes = ["php"]
patron = '''\bhash_hmac\s*\(\s*['"]([A-Za-z0-9\-]+)['"]'''
espacio = "codigo"
formato = "hmac-{1}"

[[regla]]
lenguajes = ["php"]
patron = '''(?:^|[^\w$>:])(md5|sha1)(?:_file)?\s*\('''
espacio = "codigo"

[[regla]]
lenguajes = ["php"]
patron = '''\bMCRYPT_(RIJNDAEL_128|RIJNDAEL_256|DES|3DES|TRIPLEDES|BLOWFISH|RC2|ARCFOUR)\b'''
espacio = "php-mcrypt"
nota = "La extensión mcrypt se retiró en PHP 7.2 y no recibe correcciones: migre a OpenSSL o sodium."

[[regla]]
lenguajes = ["php"]
patron = '''['"]private_key_bits['"]\s*=>\s*(\d{3,5})'''
algoritmo = "rsa"
tamano = 1

[[regla]]
lenguajes = ["php"]
patron = '''['"]curve_name['"]\s*=>\s*['"]([A-Za-z0-9\-]+)['"]'''
espacio = "codigo"

[[regla]]
lenguajes = ["php"]
patron = '''\bpassword_hash\s*\([^,]+,\s*PASSWORD_(BCRYPT|ARGON2ID|ARGON2I|DEFAULT)\b'''
espacio = "php-password"

[[regla]]
lenguajes = ["php"]
patron = '''\bsodium_crypto_(box|kx|sign|aead_aes256gcm|aead_chacha20poly1305|aead_chacha20poly1305_ietf|aead_xchacha20poly1305_ietf|pwhash)\w*\s*\('''
espacio = "sodium"

[[hallazgo]]
lenguajes = ["php"]
patron = '''\bCURLOPT_SSL_VERIFYPEER\s*,\s*(?:false|0)\b|\bCURLOPT_SSL_VERIFYHOST\s*,\s*(?:false|0)\b|['"]verify_peer(?:_name)?['"]\s*=>\s*false\b'''
riesgo = "roto-clasico"
advertencia = "Desactiva la verificación del certificado TLS (cURL o stream de PHP): la conexión no autentica al servidor."

# ---------------------------------------------------------------------------
# Ruby (OpenSSL, Digest, bcrypt)
# ---------------------------------------------------------------------------
[[regla]]
lenguajes = ["ruby"]
patron = '''\bOpenSSL::Cipher(?:::Cipher)?\.new\(\s*['"]([A-Za-z0-9\-]+)['"]'''
espacio = "codigo"

[[regla]]
lenguajes = ["ruby"]
patron = '''\bOpenSSL::Cipher::(AES|DES|DES3|Blowfish|BF|RC4|RC2|CAST5)\b'''
espacio = "codigo"

[[regla]]
lenguajes = ["ruby"]
patron = '''\b(?:Digest|OpenSSL::Digest)::(MD5|SHA1|SHA256|SHA384|SHA512)\b'''
espacio = "codigo"

[[regla]]
lenguajes = ["ruby"]
patron = '''\bOpenSSL::Digest\.new\(\s*['"]([A-Za-z0-9\-]+)['"]'''
espacio = "codigo"

[[regla]]
lenguajes = ["ruby"]
patron = '''\bOpenSSL::PKey::RSA\.(?:new|generate)\(\s*(\d{3,5})'''
algoritmo = "rsa"
tamano = 1

[[regla]]
lenguajes = ["ruby"]
patron = '''\bOpenSSL::PKey::EC\.generate\(\s*['"]([A-Za-z0-9\-]+)['"]'''
espacio = "codigo"

[[regla]]
lenguajes = ["ruby"]
patron = '''\bOpenSSL::PKey::DSA\b'''
algoritmo = "dsa"

[[regla]]
lenguajes = ["ruby"]
patron = '''\bBCrypt::Password\.create\b'''
algoritmo = "bcrypt"

[[hallazgo]]
lenguajes = ["ruby"]
patron = '''\bverify_mode\s*(?:=|:)\s*OpenSSL::SSL::VERIFY_NONE\b|\bssl_verify_mode\s*(?:=|:)\s*OpenSSL::SSL::VERIFY_NONE\b'''
riesgo = "roto-clasico"
advertencia = "VERIFY_NONE desactiva la verificación del certificado: la conexión TLS no autentica al servidor."

