lenguajes = ["shell"]
patron = '''\bopenssl\s+(?:req|x509|ca|dgst|smime|cms|ts)\b[^\n]*?\s-(md5|sha1|sha224|sha256|sha384|sha512|sha3-256|sha3-384|sha3-512)(?:[\s"']|$)'''
espacio = "codigo"
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bopenssl\s+enc\b[^\n]*?\s-(des|des3|des-ede3-cbc|des-cbc|rc4|rc2|bf|bf-cbc|aes-128-cbc|aes-192-cbc|aes-256-cbc|aes-128-ecb|aes-256-ecb|aes-128-ctr|aes-256-ctr|chacha20)(?:[\s"']|$)'''
espacio = "codigo"

[[regla]]
lenguajes = ["shell"]
patron = '''\bopenssl\s+(des3|des|rc4|bf|aes-128-cbc|aes-256-cbc)(?:[\s"']|$)'''
espacio = "codigo"

[[regla]]
lenguajes = ["shell"]
patron = '''\bopenssl\s+pkcs12\b[^\n]*?-(?:certpbe|keypbe)\s+['"]?(PBE-SHA1-3DES|PBE-SHA1-RC2-40|PBE-SHA1-RC2-128|AES-128-CBC|AES-256-CBC)\b'''
espacio = "pkcs12-pbe"
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bopenssl\s+pkcs12\b[^\n]*?\s-legacy\b'''
algoritmo = "rc2"
capacidad = "pki-ca"
nota = "openssl pkcs12 -legacy protege el archivo con RC2-40 y 3DES, algoritmos rotos."

[[regla]]
lenguajes = ["shell"]
patron = '''\bssh-keygen\b[^\n]*?-t\s+['"]?(rsa|dsa|ecdsa|ed25519|ecdsa-sk|ed25519-sk)\b'''
espacio = "ssh-keygen"
capacidad = "vpn-cifrado-red"

[[regla]]
lenguajes = ["shell"]
patron = '''\bssh-keygen\b[^\n]*?-t\s+['"]?rsa\b[^\n]*?-b\s+['"]?(\d{3,5})'''
algoritmo = "rsa"
tamano = 1
capacidad = "vpn-cifrado-red"

[[regla]]
lenguajes = ["shell"]
patron = '''\bssh-keygen\b[^\n]*?-b\s+['"]?(\d{3,5})[^\n]*?-t\s+['"]?rsa\b'''
algoritmo = "rsa"
tamano = 1
capacidad = "vpn-cifrado-red"

[[regla]]
lenguajes = ["shell"]
patron = '''\bkeytool\b[^\n]*?-keyalg\s+['"]?([A-Za-z0-9\-]+)'''
espacio = "codigo"
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bkeytool\b[^\n]*?-keysize\s+['"]?(\d{3,5})'''
algoritmo = "rsa"
tamano = 1
capacidad = "pki-ca"
requiere = '''-keyalg\s+['"]?RSA\b'''

[[regla]]
lenguajes = ["shell"]
patron = '''\bkeytool\b[^\n]*?-sigalg\s+['"]?([A-Za-z0-9]+)'''
espacio = "codigo"
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bcertbot\b[^\n]*?--rsa-key-size\s+['"]?(\d{3,5})'''
algoritmo = "rsa"
tamano = 1
capacidad = "servidores-web"

[[regla]]
lenguajes = ["shell"]
patron = '''\bcertbot\b[^\n]*?--key-type\s+['"]?(rsa|ecdsa)\b'''
espacio = "codigo"
capacidad = "servidores-web"

[[regla]]
lenguajes = ["shell"]
patron = '''\bcertbot\b[^\n]*?--elliptic-curve\s+['"]?(secp256r1|secp384r1|secp521r1)\b'''
espacio = "codigo"
capacidad = "servidores-web"

[[regla]]
lenguajes = ["shell"]
patron = '''\bstep\s+(?:certificate\s+create|crypto\s+keypair)\b[^\n]*?--kty\s+['"]?(RSA|EC|OKP)\b'''
espacio = "step-kty"
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bstep\s+(?:certificate\s+create|crypto\s+keypair)\b[^\n]*?--crv\s+['"]?(P-256|P-384|P-521|Ed25519|X25519)\b'''
espacio = "codigo"
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bstep\s+(?:certificate\s+create|crypto\s+keypair)\b[^\n]*?--size\s+['"]?(\d{3,5})'''
algoritmo = "rsa"
tamano = 1
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bgpg2?\b[^\n]*?--quick-gen(?:erate)?-key\s+\S+\s+['"]?rsa(\d{3,5})\b'''
algoritmo = "rsa"
tamano = 1
capacidad = "firma-codigo"

[[regla]]
lenguajes = ["shell"]
patron = '''\bgpg2?\b[^\n]*?--quick-gen(?:erate)?-key\s+\S+\s+['"]?(dsa\d+|ed25519|ed448|cv25519|cv448|nistp256|nistp384|nistp521|brainpoolP256r1|brainpoolP384r1|brainpoolP512r1)\b'''
espacio = "gpg"
capacidad = "firma-codigo"

[[regla]]
lenguajes = ["shell"]
patron = '''\bwg\s+genkey\b'''
algoritmo = "x25519"
capacidad = "vpn-cifrado-red"

[[regla]]
lenguajes = ["shell"]
patron = '''(?m)^\s*-?\s*size:\s*['"]?(\d{3,5})['"]?\s*$'''
algoritmo = "rsa"
tamano = 1
capacidad = "pki-ca"
requiere = '''\bopenssl_privatekey\b'''

[[regla]]
lenguajes = ["shell"]
patron = '''(?m)^\s*-?\s*type:\s*['"]?(RSA|DSA|ECC|Ed25519|Ed448|X25519|X448)['"]?\s*$'''
espacio = "ansible-tipo"
capacidad = "pki-ca"
requiere = '''\bopenssl_privatekey\b'''

[[regla]]
lenguajes = ["shell"]
patron = '''(?m)^\s*-?\s*curve:\s*['"]?(secp256r1|secp384r1|secp521r1|brainpoolP256r1|brainpoolP384r1|brainpoolP512r1)['"]?\s*$'''
espacio = "codigo"
capacidad = "pki-ca"
requiere = '''\bopenssl_privatekey\b'''

[[hallazgo]]
lenguajes = ["shell"]
patron = '''\bcurl\b[^\n|;&]*?\s(?:-[A-Za-z]*k[A-Za-z]*|--insecure)(?:\s|$)|\bwget\b[^\n|;&]*?--no-check-certificate\b'''
riesgo = "roto-clasico"
advertencia = "curl -k o wget --no-check-certificate descargan sin verificar el certificado: un intermediario puede sustituir el contenido."

[[hallazgo]]
lenguajes = ["shell"]
patron = '''\bGIT_SSL_NO_VERIFY\s*[=:]\s*['"]?(?:1|true)\b|\bhttp\.sslVerify\s*[= ]\s*['"]?false\b|\bNODE_TLS_REJECT_UNAUTHORIZED\s*[=:]\s*['"]?0\b|\bPYTHONHTTPSVERIFY\s*[=:]\s*['"]?0\b|\bnpm\s+config\s+set\s+strict-ssl\s+false\b|\bpip3?\b[^\n]*?--trusted-host\b'''
riesgo = "roto-clasico"
advertencia = "Desactiva la verificación de certificados de una herramienta (git, Node.js, Python, npm o pip) en un script o pipeline."

[[hallazgo]]
lenguajes = ["shell"]
patron = '''--tls-min-version[= ]['"]?VersionTLS1[01]\b'''
riesgo = "obsoleto"
advertencia = "Un componente (por ejemplo, de Kubernetes) admite TLS 1.0 o 1.1."

