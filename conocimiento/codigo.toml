# ---------------------------------------------------------------------------
[[regla]]
lenguajes = ["shell"]
patron = '''\bopenssl\s+genrsa\b[^\n|;&]*?\s(\d{3,5})(?:[\s"']|$)'''
algoritmo = "rsa"
tamano = 1
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bopenssl\s+genrsa\b'''
algoritmo = "rsa"
capacidad = "pki-ca"
nota = "openssl genrsa sin tamaño explícito usa 2048 bits en OpenSSL 3."

[[regla]]
lenguajes = ["shell"]
patron = '''\bopenssl\s+req\b[^\n]*?-newkey\s+rsa:(\d{3,5})'''
algoritmo = "rsa"
tamano = 1
capacidad = "pki-ca"

[[regla]]
lenguajes = ["shell"]
patron = '''\bopenssl\s+req\b[^\n]*?-newkey\s+([A-Za-z0-9\-]+)(?:[\s:"']|$)'''
