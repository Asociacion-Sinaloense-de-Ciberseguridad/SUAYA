# Suaya: recetas de corrección.
#
# Cada receta dice cómo corregir un tipo de hallazgo. El reporte las muestra
# junto a los activos que cubren y `suaya diagnosticar` junto a sus hallazgos.
# Como el resto del conocimiento, viven como datos: se actualizan sin
# recompilar y pueden sustituirse con `--base-conocimiento <directorio>`.
#
# Se aplica la primera receta que coincide, en el orden del archivo: de lo
# específico a lo general. Una receta coincide con un activo si cumple todos
# los criterios que declara:
#   algoritmos   identificadores de algoritmos.toml
#   tipos        algorithm | certificate | related-crypto-material | protocol | library
#   riesgos      roto-clasico | obsoleto | vulnerable-cuantico | debilitado-grover | desconocido
#   capacidades  identificadores de madurez.toml
#   garantias    confidencialidad | autenticacion | integridad
# Una receta sin criterios de activo solo se usa por `hallazgos` (códigos del
# diagnóstico, p. ej. CERT-VENCE).
#
# Los pasos citan versiones y directivas vigentes al cierre de esta edición;
# verifíquelas contra la documentación de su producto antes de aplicarlas.

[meta]
version = "2026.11.0"
descripcion = "Recetas de corrección para Suaya"

[[receta]]
id = "tls-hibrido"
titulo = "Habilitar el intercambio híbrido X25519MLKEM768 en TLS 1.3"
titulo_en = "Enable the X25519MLKEM768 hybrid key exchange in TLS 1.3"
algoritmos = ["x25519", "x448", "ecdh-p256", "ecdh-p384", "ecdh-p521", "ecdh", "ffdh", "ecdh-brainpoolp256r1", "ecdh-brainpoolp384r1", "ecdh-brainpoolp512r1"]
capacidades = ["servidores-web", "conectividad-nube", "navegadores-web"]
hallazgos = ["KEX-CLASICO"]
pasos = [
  "Actualice la biblioteca TLS a una versión con ML-KEM: OpenSSL 3.5 o posterior, BoringSSL, AWS-LC, Go 1.24 o posterior (lo activa por omisión) o rustls 0.23 con aws-lc-rs.",
  "nginx: ssl_protocols TLSv1.2 TLSv1.3; y ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;",
  "Apache httpd: SSLOpenSSLConfCmd Groups X25519MLKEM768:X25519:prime256v1",
  "HAProxy (sección global): ssl-default-bind-curves X25519MLKEM768:X25519:P-256",
  "Verifique con suaya diagnosticar tls://servidor:443: el cliente moderno debe negociar X25519MLKEM768.",
]
pasos_en = [
  "Upgrade the TLS library to a version with ML-KEM: OpenSSL 3.5 or later, BoringSSL, AWS-LC, Go 1.24 or later (enabled by default) or rustls 0.23 with aws-lc-rs.",
  "nginx: ssl_protocols TLSv1.2 TLSv1.3; and ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;",
  "Apache httpd: SSLOpenSSLConfCmd Groups X25519MLKEM768:X25519:prime256v1",
  "HAProxy (global section): ssl-default-bind-curves X25519MLKEM768:X25519:P-256",
  "Verify with suaya diagnosticar tls://server:443: the modern client must negotiate X25519MLKEM768.",
]
referencias = ["https://datatracker.ietf.org/doc/draft-ietf-tls-ecdhe-mlkem/"]

