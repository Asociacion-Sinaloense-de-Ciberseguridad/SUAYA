name: Publicación

# Se dispara al empujar una etiqueta de versión (v1.0.0). Compila para cada
# plataforma con las mismas banderas que scripts/compilacion-reproducible.sh,
# atestigua la procedencia de cada paquete (SLSA, firmada con Sigstore),
# publica SHA256SUMS y, si existe el secreto SUAYA_LLAVE_FIRMA, lo firma con
# la firma híbrida de Suaya (ML-DSA-65 y Ed25519). La publicación queda como
# borrador para revisión humana.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verificar:
    uses: ./.github/workflows/ci.yml

  compilar:
    needs: verificar
    name: Compilar (${{ matrix.objetivo }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { objetivo: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { objetivo: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { objetivo: aarch64-apple-darwin, os: macos-15 }
          - { objetivo: x86_64-pc-windows-msvc, os: windows-2025 }
    steps:
      # Acciones fijadas por commit: checkout v7.0.1, upload-artifact v7.0.2,
      # attest-build-provenance v4.2.2 y rust-toolchain (rama stable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.objetivo }}
      # scripts/manifest-build.py usa tomllib; ubuntu-22.04 trae Python 3.10. v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Compilar de forma reproducible
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export CARGO_INCREMENTAL=0
          export RUSTFLAGS="--remap-path-prefix=$PWD=/suaya --remap-path-prefix=$HOME/.cargo=/cargo"
          if [[ "${{ matrix.objetivo }}" == *apple-darwin ]]; then
            export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-no_uuid"
          fi
          if [[ "${{ matrix.objetivo }}" != *windows* ]]; then
            export CFLAGS="-ffile-prefix-map=$PWD=/suaya -ffile-prefix-map=$HOME/.cargo=/cargo"
            export CXXFLAGS="$CFLAGS"
          else
            # aws-lc-sys necesita NASM en Windows x86_64 y la imagen windows-2025
            # no lo trae: se usan los objetos NASM precompilados del propio crate.
            export AWS_LC_SYS_PREBUILT_NASM=1
          fi
          cargo build --locked --release --target ${{ matrix.objetivo }} -p suaya -p suaya-api
      - name: Empaquetar
        id: paquete
        shell: bash
        # Python lee la salida de cargo metadata en UTF-8 también en Windows.
        env:
          PYTHONUTF8: "1"
        run: |
          version=${GITHUB_REF_NAME#v}
          nombre=suaya-$version-${{ matrix.objetivo }}
          mkdir -p "$nombre/completado"
          exe=target/${{ matrix.objetivo }}/release/suaya
          [ -f "$exe.exe" ] && exe=$exe.exe
          cp "$exe" LICENSE NOTICE README.md "$nombre/"
          # manifest-build.py consulta cargo metadata sin red y este resuelve las
          # dependencias de todas las plataformas, no solo las ya compiladas.
          cargo fetch --locked
          python3 scripts/manifest-build.py --output "$nombre/build-manifest.json"
          api=target/${{ matrix.objetivo }}/release/suaya-api
          [ -f "$api.exe" ] && api=$api.exe
          cp "$api" "$nombre/"
          "$exe" manual > "$nombre/suaya.1"
          for s in bash zsh fish powershell; do "$exe" completado $s > "$nombre/completado/suaya.$s"; done
          if [[ "${{ matrix.objetivo }}" == *windows* ]]; then
            7z a -tzip "$nombre.zip" "$nombre" >/dev/null
            echo "archivo=$nombre.zip" >> "$GITHUB_OUTPUT"
          else
            tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner -czf "$nombre.tar.gz" "$nombre" 2>/dev/null \
              || tar -czf "$nombre.tar.gz" "$nombre"
            echo "archivo=$nombre.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      # GitHub solo admite atestaciones en repositorios públicos salvo con
      # Enterprise Cloud; si el repositorio vuelve a ser privado, se omiten.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: ${{ steps.paquete.outputs.archivo }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paquete-${{ matrix.objetivo }}
          path: ${{ steps.paquete.outputs.archivo }}
          if-no-files-found: error

  # Linux se compila en Ubuntu 22.04 (glibc 2.35) para que el binario y los
  # paquetes funcionen también en Debian 12 y Ubuntu 22.04 o posteriores.
  paquetes-linux:
    needs: verificar
    name: Paquetes .deb y .rpm
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
      - name: Compilar y generar paquetes
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export RUSTFLAGS="--remap-path-prefix=$PWD=/suaya --remap-path-prefix=$HOME/.cargo=/cargo"
          if [[ "${{ matrix.objetivo }}" == *apple-darwin ]]; then
            export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-no_uuid"
          fi
          export CFLAGS="-ffile-prefix-map=$PWD=/suaya -ffile-prefix-map=$HOME/.cargo=/cargo"
          export CXXFLAGS="$CFLAGS"
          cargo build --locked --release -p suaya -p suaya-api
          ./empaquetado/generar.sh target/release/suaya
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0
          cargo deb --no-build -p suaya
          cargo deb --no-build -p suaya-api
          cargo generate-rpm -p crates/suaya-cli
          cargo generate-rpm -p crates/suaya-api
          dpkg-deb --contents target/debian/suaya-api_*.deb
          dpkg-deb --contents target/debian/suaya_*.deb
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paquetes-linux
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

  publicar:
    name: Publicar borrador
    needs: [compilar, paquetes-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: publicacion
          # Solo los paquetes: la verificación también sube cobertura y SBOM.
          pattern: paquete*
          merge-multiple: true
      - name: Sumas de verificación y firma híbrida
        env:
          SUAYA_LLAVE_FIRMA: ${{ secrets.SUAYA_LLAVE_FIRMA }}
          SUAYA_CLAVE_FIRMA: ${{ secrets.SUAYA_CLAVE_FIRMA }}
        run: |
          # Instaladores por sistema operativo, junto a los paquetes.
          cp empaquetado/instaladores/instalar-windows.ps1 empaquetado/instaladores/instalar.sh publicacion/
          cd publicacion
          # Los .deb y .rpm llegan en subcarpetas (debian/, generate-rpm/).
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum * > SHA256SUMS
          if [ -n "$SUAYA_LLAVE_FIRMA" ]; then
            tar -xzf suaya-*-x86_64-unknown-linux-gnu.tar.gz --wildcards '*/suaya' --strip-components=1
            umask 077
            printf '%s' "$SUAYA_LLAVE_FIRMA" > ../llave.json
            ./suaya firmar SHA256SUMS --llave ../llave.json
            rm -f ../llave.json suaya
          fi
      - name: Crear la publicación (borrador)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="## [$version]" 'index($0, v)==1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notas.md
          gh release create "$GITHUB_REF_NAME" publicacion/* --draft --title "Suaya $version" --notes-file notas.md
